<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Keuangan Pribadi</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f0;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 100px;
            height: 100px;
        }

        .logo h1 {
            color: #16a34a;
            margin: 10px 0;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .password-wrapper button {
            position: absolute;
            right: 5px;
            top: 5px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            padding: 8px 12px;
        }

        .login-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-success {
            background: #16a34a;
        }

        .btn-primary {
            background: #16a34a;
        }

        .btn-info {
            background: #2563eb;
        }

        .btn-warning {
            background: #f59e0b;
        }

        #loginStatus {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">

            <img src="icons/icon-192.png" alt="Logo">

            <h1>💰 Keuangan Pribadi</h1>

            <p>Login Administrator</p>

        </div>

        <label>PIN Admin</label>

        <div class="password-wrapper">

            <input
                type="password"
                id="pinLogin"
                placeholder="Masukkan PIN Admin">

            <button
                type="button"
                onclick="togglePIN()">
                👁
            </button>

        </div>

        <div class="login-actions">

            <button
                class="btn btn-success"
                onclick="loginGoogle()">
                🔵 Login dengan Google
            </button>

            <button
                class="btn btn-primary"
                onclick="loginPIN()">
                🔐 Login dengan PIN
            </button>

            <button
                class="btn btn-info"
                onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>

            <button
                class="btn btn-warning"
                onclick="location.href='index.html'">
                🏠 Dashboard
            </button>

        </div>

        <div id="loginStatus"></div>

    </div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<!-- App JS -->

<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>

<script>

function setStatus(text, color) {

    const status = document.getElementById("loginStatus");

    status.innerHTML = text;
    status.style.color = color;
}

function togglePIN() {

    const pinInput = document.getElementById("pinLogin");

    pinInput.type =
        pinInput.type === "password"
            ? "text"
            : "password";
}

function loginPIN() {

    const pin =
        document.getElementById("pinLogin")
        .value
        .trim();

    if (!pin) {

        setStatus(
            "❌ Masukkan PIN terlebih dahulu",
            "#dc2626"
        );

        return;
    }

    if (
        typeof verifyPIN === "function" &&
        verifyPIN(pin)
    ) {

        if (
            typeof loginAdmin === "function"
        ) {
            loginAdmin();
        }

        setStatus(
            "✅ Login berhasil",
            "#16a34a"
        );

        setTimeout(() => {

            location.href =
                "transaksi.html";

        }, 800);

    } else {

        setStatus(
            "❌ PIN salah",
            "#dc2626"
        );
    }
}

function loginGoogle() {

    if (
        typeof window.loginWithGoogle ===
        "function"
    ) {

        window.loginWithGoogle();

    } else {

        setStatus(
            "❌ Fungsi Login Google tidak ditemukan",
            "#dc2626"
        );
    }
}

document
.getElementById("pinLogin")
.addEventListener(
    "keypress",
    function(e){

        if(e.key === "Enter"){

            loginPIN();

        }
    }
);

if (
    typeof isAdminLoggedIn === "function" &&
    isAdminLoggedIn()
) {

    location.href =
        "transaksi.html";
}

</script>

</body>
</html>
