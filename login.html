<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Keuangan Pribadi</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 24px;
        }

        .logo h1 {
            color: #16a34a;
            margin-top: 12px;
        }

        .logo p {
            color: #666;
            margin-top: 5px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 8px 12px;
        }

        .login-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        #loginStatus {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 24px;
        }
    </style>
</head>

<body>

    <div class="login-page">

        <div class="card login-card">

            <div class="logo">

                <img src="icons/icon-192.png" alt="Logo Keuangan Pribadi">

                <h1>💰 Keuangan Pribadi</h1>

                <p>Login Administrator</p>

            </div>

            <label for="pinLogin">
                PIN Admin
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="pinLogin"
                    placeholder="Masukkan PIN Admin">

                <button
                    type="button"
                    class="btn btn-info"
                    onclick="togglePIN()">

                    👁

                </button>

            </div>

            <div class="login-actions">

                <button
                    class="btn btn-primary btn-full"
                    onclick="login()">

                    🔐 Login

                </button>

                <button
                    class="btn btn-info btn-full"
                    onclick="toggleDarkMode()">

                    🌙 Dark Mode

                </button>

                <button
                    class="btn btn-warning btn-full"
                    onclick="location.href='index.html'">

                    🏠 Dashboard

                </button>

            </div>

            <div id="loginStatus"></div>

        </div>

    </div>

    <!-- APP JS -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <script src="assets/js/firebase-config.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log("✅ Firebase Ready");

        function togglePIN() {

            const input =
                document.getElementById("pinLogin");

            input.type =
                input.type === "password"
                    ? "text"
                    : "password";

        }

        function login() {

            const pin =
                document
                    .getElementById("pinLogin")
                    .value
                    .trim();

            const status =
                document
                    .getElementById("loginStatus");

            if (!getPIN()) {

                status.style.color = "#dc2626";

                status.innerHTML =
                    "❌ PIN Admin belum dibuat. Silakan buat PIN di menu Profil.";

                return;

            }

            if (!pin) {

                status.style.color = "#dc2626";

                status.innerHTML =
                    "❌ Masukkan PIN terlebih dahulu.";

                return;

            }

            if (verifyPIN(pin)) {

                if (
                    typeof loginAdmin === "function"
                ) {

                    loginAdmin();

                }

                status.style.color = "#16a34a";

                status.innerHTML =
                    "✅ Login berhasil.";

                setTimeout(() => {

                    location.href =
                        "transaksi.html";

                }, 800);

            } else {

                status.style.color = "#dc2626";

                status.innerHTML =
                    "❌ PIN Admin salah.";

            }

        }

        document
            .getElementById("pinLogin")
            .addEventListener("keypress", function (e) {

                if (e.key === "Enter") {

                    login();

                }

            });

        if (
            typeof isAdminLoggedIn === "function" &&
            isAdminLoggedIn()
        ) {

            location.href =
                "transaksi.html";

        }
    </script>

</body>

</html>
