<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#16a34a">

    <link rel="stylesheet" href="assets/css/style.css">

    <style>

    .login-page{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .login-card{
        width:100%;
        max-width:420px;
    }

    .logo{
        text-align:center;
        margin-bottom:25px;
    }

    .logo img{
        width:100px;
        height:100px;
        object-fit:cover;
        border-radius:24px;
    }

    .logo h1{
        color:#16a34a;
        margin-top:10px;
    }

    .password-wrapper{
        position:relative;
    }

    .password-wrapper button{
        position:absolute;
        right:10px;
        top:50%;
        transform:translateY(-50%);
        width:auto;
        padding:8px 12px;
    }

    .login-actions{
        display:flex;
        flex-direction:column;
        gap:10px;
        margin-top:15px;
    }

    </style>

</head>

<body>

<div class="login-page">

    <div class="card login-card">

        <div class="logo">

            Icons/icon-192.png

            <h1>Keuangan Pribadi</h1>

            <p>Login Administrator</p>

        </div>

        <label>PIN Admin</label>

        <div class="password-wrapper">

            <input
                type="password"
                id="pinLogin"
                placeholder="Masukkan PIN Admin">

            <button
                type="button"
                class="btn btn-info"
                onclick="togglePIN()">

                👁

            </button>

        </div>

        <div class="login-actions">

            <button
                class="btn btn-primary btn-full"
                onclick="login()">

                🔐 Login

            </button>

            <button
                class="btn btn-info btn-full"
                onclick="toggleDarkMode()">

                🌙 Dark Mode

            </button>

            <button
                class="btn btn-warning btn-full"
                onclick="location.href='index.html'">

                🏠 Kembali ke Dashboard

            </button>

        </div>

        <div
            id="loginStatus"
            class="status">

        </div>

    </div>

</div>

assets/js/storage.jsscript>
assets/js/app.jsscript>
assets/js/auth.jsscript>

<script>

function togglePIN(){

    const input =
    document.getElementById(
        "pinLogin"
    );

    input.type =
    input.type === "password"
    ? "text"
    : "password";

}

function login(){

    const pin =
    document.getElementById(
        "pinLogin"
    ).value.trim();

    const status =
    document.getElementById(
        "loginStatus"
    );

    if(!getPIN()){

        status.style.color="red";

        status.innerHTML =
        "❌ PIN Admin belum dibuat. Silakan buat PIN di menu Profil.";

        return;

    }

    if(!pin){

        status.style.color="red";

        status.innerHTML =
        "❌ Masukkan PIN terlebih dahulu";

        return;

    }

    if(verifyPIN(pin)){

        loginAdmin();

        status.style.color="#16a34a";

        status.innerHTML =
        "✅ Login berhasil";

        setTimeout(() => {

            location.href =
            "transaksi.html";

        },800);

    }else{

        status.style.color="#dc2626";

        status.innerHTML =
        "❌ PIN salah";

    }

}

document
.getElementById("pinLogin")
.addEventListener(
    "keypress",
    function(e){

        if(e.key==="Enter"){

            login();

        }

    }
);

if(
    typeof isAdminLoggedIn ===
    "function" &&
    isAdminLoggedIn()
){

    location.href =
    "transaksi.html";

}

</script>

</body>

</html>
