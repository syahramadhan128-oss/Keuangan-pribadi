<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Login Admin - Keuangan Pribadi

    </title>

    <link
        rel="manifest"
        href="manifest.json">

    <meta
        name="theme-color"
        content="#16a34a">

    <link
        rel="stylesheet"
        href="assets/css/style.css">

    <style>

        .login-page{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

        }

        .login-card{

            width:100%;

            max-width:420px;

        }

        .logo{

            text-align:center;

            margin-bottom:25px;

        }

        .logo img{

            width:100px;

            height:100px;

            border-radius:24px;

        }

        .logo h1{

            color:#16a34a;

            margin-top:10px;

        }

        .password-wrapper{

            position:relative;

        }

        .password-wrapper button{

            position:absolute;

            top:50%;

            right:10px;

            transform:translateY(-50%);

            width:auto;

            padding:8px 12px;

        }

        .login-actions{

            display:flex;

            flex-direction:column;

            gap:10px;

            margin-top:15px;

        }

        #loginStatus{

            margin-top:15px;

            text-align:center;

            font-weight:bold;

            min-height:24px;

        }

    </style>

</head>

<body>

<div class="login-page">

    <div class="card login-card">

        <div class="logo">

            <img
                src="icons/icon-192.png"
                alt="Logo">

            <h1>

                💰 Keuangan Pribadi

            </h1>

            <p>

                Login Administrator

            </p>

        </div>

        <label>

            PIN Admin

        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="pinLogin"
                placeholder="Masukkan PIN Admin">

            <button
                type="button"
                class="btn btn-info"
                onclick="togglePIN()">

                👁

            </button>

        </div>

        <div class="login-actions">

            <button
                class="btn btn-success btn-full"
                onclick="loginGoogle()">

                🔵 Login dengan Google

            </button>

            <button
                class="btn btn-primary btn-full"
                onclick="loginPIN()">

                🔐 Login dengan PIN

            </button>

            <button
                class="btn btn-info btn-full"
                onclick="toggleDarkMode()">

                🌙 Dark Mode

            </button>

            <button
                class="btn btn-warning btn-full"
                onclick="location.href='index.html'">

                🏠 Dashboard

            </button>

        </div>

        <div id="loginStatus">

        </div>

    </div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<!-- Core -->

<script src="assets/js/firebase-config.js"></script>

<script src="assets/js/storage.js"></script>

<script src="assets/js/app.js"></script>

<script src="assets/js/auth.js"></script>

<script>

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

console.log(
    "✅ Firebase Ready"
);

function setStatus(
    text,
    color
){

    const status =
    document.getElementById(
        "loginStatus"
    );

    status.style.color =
    color;

    status.innerHTML =
    text;

}

function togglePIN(){

    const input =
    document.getElementById(
        "pinLogin"
    );

    input.type =
    input.type === "password"
    ? "text"
    : "password";

}

async function loginGoogle(){

    try{

        const provider =
        new firebase.auth.GoogleAuthProvider();

        const result =
        await auth.signInWithPopup(
            provider
        );

        const user =
        result.user;

        localStorage.setItem(
            "googleUser",
            JSON.stringify({
                uid:user.uid,
                nama:user.displayName,
                email:user.email
            })
        );

        setStatus(
            "✅ Login Google berhasil",
            "#16a34a"
        );

        setTimeout(() => {

            location.href =
            "index.html";

        },1000);

    }catch(error){

        console.error(error);

        setStatus(
            "❌ Login Google gagal",
            "#dc2626"
        );

    }

}

function loginPIN(){

    const pin =
    document
    .getElementById(
        "pinLogin"
    )
    .value
    .trim();

    if(!getPIN()){

        setStatus(
            "❌ PIN Admin belum dibuat",
            "#dc2626"
        );

        return;

    }

    if(!pin){

        setStatus(
            "❌ Masukkan PIN terlebih dahulu",
            "#dc2626"
        );

        return;

    }

    if(
        verifyPIN(pin)
    ){

        loginAdmin();

        setStatus(
            "✅ Login berhasil",
            "#16a34a"
        );

        setTimeout(() => {

            location.href =
            "transaksi.html";

        },800);

    }else{

        setStatus(
            "❌ PIN Admin salah",
            "#dc2626"
        );

    }

}

document
.getElementById(
    "pinLogin"
)
.addEventListener(
    "keypress",
    function(e){

        if(
            e.key === "Enter"
        ){

            loginPIN();

        }

    }
);

if(
    typeof isAdminLoggedIn ===
    "function" &&
    isAdminLoggedIn()
){

    location.href =
    "transaksi.html";

}

</script>

</body>

</html>
