<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keuangan Pribadi</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:100px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.saldo{
background:#16a34a;
color:white;
text-align:center;
}

.saldo h2{
font-size:35px;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
padding:15px;
border-radius:12px;
color:white;
text-align:center;
}

.masuk{
background:#2563eb;
}

.keluar{
background:#dc2626;
}

.box p{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.filter{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
}

.tx{
padding:10px;
margin-bottom:10px;
background:#f5f5f5;
border-radius:10px;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

@media (max-width:600px){

.grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>💰 Keuangan Pribadi</h1>
<p>Dashboard</p>
</div>

<div class="card">
<h3>📅 Filter Bulan</h3>
<br>
<input type="month" id="filterBulan" class="filter">
</div>

<div class="card saldo">
<h3>Saldo Saat Ini</h3>
<h2 id="saldo">Rp 0</h2>
</div>

<div class="grid">

<div class="box masuk">
<h4>Pemasukan</h4>
<p id="totalMasuk">Rp 0</p>
</div>

<div class="box keluar">
<h4>Pengeluaran</h4>
<p id="totalKeluar">Rp 0</p>
</div>

</div>

<div class="card">
<h3>📊 Pengeluaran per Kategori</h3>
<br>
<canvas id="expenseChart"></canvas>
</div>

<div class="card">
<h3>📋 5 Transaksi Terakhir</h3>
<br>
<div id="lastTransactions"></div>
</div>

</div>

<div class="bottom-nav">

<a href="index.html" class="active">
🏠<br>Dashboard
</a>

<a href="transaksi.html">
➕<br>Transaksi
</a>

<a href="laporan.html">
📊<br>Laporan
</a>

<a href="profil.html">
⚙️<br>Profil
</a>

</div>

<script>

let chart = null;

function rupiah(n){
return "Rp " + Number(n).toLocaleString("id-ID");
}

function getData(){

return JSON.parse(
localStorage.getItem("transaksi")
) || [];

}

function setDefaultMonth(){

const now = new Date();

document.getElementById("filterBulan").value =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

}

function loadDashboard(){

const bulan =
document.getElementById("filterBulan").value;

const data =
getData();

const filtered =
data.filter(item => {

if(!bulan) return true;

return item.tanggal.startsWith(bulan);

});

let masuk = 0;
let keluar = 0;

const kategori = {};

filtered.forEach(item=>{

const nominal =
Number(item.nominal);

if(item.jenis === "Masuk"){

masuk += nominal;

}else{

keluar += nominal;

kategori[item.kategori] =
(kategori[item.kategori] || 0)
+ nominal;

}

});

const saldo = masuk - keluar;

document.getElementById("saldo").textContent =
rupiah(saldo);

document.getElementById("totalMasuk").textContent =
rupiah(masuk);

document.getElementById("totalKeluar").textContent =
rupiah(keluar);

const transaksi =
[...filtered]
.reverse()
.slice(0,5);

document.getElementById("lastTransactions")
.innerHTML =
transaksi.length
? transaksi.map(item => `
<div class="tx">
<b>${item.kategori}</b><br>
${item.tanggal}<br>
${rupiah(item.nominal)}
</div>
`).join("")
: "Belum ada transaksi";

if(chart){
chart.destroy();
}

chart =
new Chart(
document.getElementById("expenseChart"),
{
type:"doughnut",
data:{
labels:Object.keys(kategori),
datasets:[{
data:Object.values(kategori)
}]
}
}
);

}

document
.getElementById("filterBulan")
.addEventListener(
"change",
loadDashboard
);

setDefaultMonth();
loadDashboard();

</script>

</body>
</html>
