<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil & Pengaturan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:100px;
transition:.3s;
}

.container{
max-width:900px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:5px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#15803d;
}

.danger{
background:#dc2626;
}

.danger:hover{
background:#b91c1c;
}

.progress{
width:100%;
height:20px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#16a34a;
transition:.3s;
}

.info{
background:#f5f5f5;
padding:10px;
border-radius:10px;
margin-top:10px;
line-height:1.6;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
z-index:9999;
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

.dark{
background:#111827;
color:white;
}

.dark .card{
background:#1f2937;
color:white;
}

.dark input{
background:#374151;
color:white;
border:none;
}

.dark .info{
background:#374151;
}

.dark .bottom-nav{
background:#1f2937;
}

.dark .bottom-nav a{
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>⚙️ Profil & Pengaturan</h1>
</div>

<div class="card">

<h3>👤 Profil Pengguna</h3>

<label>Nama</label>
<input type="text" id="nama">

<label>Email</label>
<input type="email" id="email">

<button onclick="simpanProfil()">
💾 Simpan Profil
</button>

</div>

<div class="card">

<h3>🔒 PIN Admin</h3>

<label>PIN</label>
<input
type="password"
id="pinAdmin"
placeholder="Minimal 4 digit">

<button onclick="simpanPIN()">
🔐 Simpan PIN
</button>

<button
class="danger"
onclick="hapusPIN()">
🗑 Hapus PIN
</button>

<div class="info" id="statusPIN">
PIN belum dibuat
</div>

</div>

<div class="card">

<h3>🎯 Target Tabungan</h3>

<label>Nama Target</label>
<input
type="text"
id="namaTarget">

<label>Nominal Target</label>
<input
type="number"
id="target">

<label>Nominal Terkumpul</label>
<input
type="number"
id="terkumpul">

<button onclick="hitungTarget()">
🎯 Simpan Target
</button>

<div class="progress">
<div
class="progress-bar"
id="progressBar">
</div>
</div>

<div
class="info"
id="hasilTarget">
Belum ada target.
</div>

</div>

<div class="card">

<h3>🌙 Dark Mode</h3>

<button onclick="toggleDarkMode()">
Aktifkan / Nonaktifkan Dark Mode
</button>

</div>

<div class="card">

<h3>💾 Backup & Restore</h3>

<button onclick="backupData()">
📥 Backup Data JSON
</button>

<input
type="file"
id="restoreFile"
accept=".json">

<button onclick="restoreData()">
📤 Restore Data
</button>

</div>

<div class="card">

<h3>🗑 Reset Data</h3>

<button
class="danger"
onclick="resetSemuaData()">
Hapus Seluruh Data Keuangan
</button>

</div>

<div class="card">

<h3>ℹ️ Tentang Aplikasi</h3>

<div class="info">
Keuangan Pribadi v2.0<br>
Database: Local Storage Browser<br>
Mode: Offline Ready
</div>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>Dashboard
</a>

<a href="transaksi.html">
➕<br>Transaksi
</a>

<a href="laporan.html">
📊<br>Laporan
</a>

<a href="profil.html" class="active">
⚙️<br>Profil
</a>

</div>

<script>

function simpanProfil(){

const profil = {
nama:document.getElementById("nama").value,
email:document.getElementById("email").value
};

localStorage.setItem(
"profil",
JSON.stringify(profil)
);

alert("Profil berhasil disimpan");

}

function loadProfil(){

const data =
JSON.parse(
localStorage.getItem("profil")
);

if(!data) return;

document.getElementById("nama").value =
data.nama || "";

document.getElementById("email").value =
data.email || "";

}

function simpanPIN(){

const pin =
document.getElementById("pinAdmin").value;

if(pin.length < 4){

alert("PIN minimal 4 digit");
return;

}

localStorage.setItem(
"adminPIN",
pin
);

tampilkanStatusPIN();

alert("PIN berhasil disimpan");

}

function hapusPIN(){

if(
!confirm(
"Hapus PIN Admin?"
)
){
return;
}

localStorage.removeItem(
"adminPIN"
);

tampilkanStatusPIN();

alert("PIN berhasil dihapus");

}

function tampilkanStatusPIN(){

const pin =
localStorage.getItem("adminPIN");

document.getElementById(
"statusPIN"
).innerHTML =
pin
? "✅ PIN Admin Aktif"
: "❌ PIN Belum Dibuat";

}

function hitungTarget(){

const namaTarget =
document.getElementById("namaTarget").value;

const target =
Number(
document.getElementById("target").value
);

const terkumpul =
Number(
document.getElementById("terkumpul").value
);

if(target <= 0){
return;
}

const persen =
Math.min(
100,
(terkumpul/target)*100
);

document.getElementById(
"progressBar"
).style.width =
persen + "%";

document.getElementById(
"hasilTarget"
).innerHTML =
`
<b>${namaTarget}</b><br><br>

Progress:
<b>${persen.toFixed(1)}%</b>

<br><br>

Target:
Rp ${target.toLocaleString("id-ID")}

<br>

Terkumpul:
Rp ${terkumpul.toLocaleString("id-ID")}
`;

localStorage.setItem(
"targetTabungan",
JSON.stringify({
namaTarget,
target,
terkumpul
})
);

}

function loadTarget(){

const data =
JSON.parse(
localStorage.getItem(
"targetTabungan"
)
);

if(!data) return;

document.getElementById("namaTarget").value =
data.namaTarget || "";

document.getElementById("target").value =
data.target || "";

document.getElementById("terkumpul").value =
data.terkumpul || "";

hitungTarget();

}

function toggleDarkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains(
"dark"
)
);

}

function loadDarkMode(){

const dark =
localStorage.getItem("darkMode");

if(dark==="true"){

document.body.classList.add(
"dark"
);

}

}

function backupData(){

const data = {

transaksi:
JSON.parse(
localStorage.getItem("transaksi")
) || [],

profil:
JSON.parse(
localStorage.getItem("profil")
) || {},

target:
JSON.parse(
localStorage.getItem(
"targetTabungan"
)
) || {}

};

const blob =
new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download =
"backup-keuangan.json";

a.click();

}

function restoreData(){

const file =
document.getElementById(
"restoreFile"
).files[0];

if(!file){

alert("Pilih file JSON");
return;

}

const reader =
new FileReader();

reader.onload = function(e){

const data =
JSON.parse(
e.target.result
);

localStorage.setItem(
"transaksi",
JSON.stringify(
data.transaksi || []
)
);

localStorage.setItem(
"profil",
JSON.stringify(
data.profil || {}
)
);

localStorage.setItem(
"targetTabungan",
JSON.stringify(
data.target || {}
)
);

alert(
"Restore berhasil"
);

location.reload();

};

reader.readAsText(file);

}

function resetSemuaData(){

if(
!confirm(
"Yakin hapus seluruh data?"
)
){
return;
}

localStorage.removeItem(
"transaksi"
);

alert(
"Semua data transaksi berhasil dihapus"
);

}

loadProfil();
loadTarget();
loadDarkMode();
tampilkanStatusPIN();

</script>

</body>
</html>
