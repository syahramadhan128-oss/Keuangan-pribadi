<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<link rel="stylesheet" href="assets/css/style.css">

<style>

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:100%;
    max-width:400px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:100px;
    height:100px;
    object-fit:contain;
}

.logo h1{
    color:#16a34a;
    margin-top:10px;
}

.password-wrapper{
    position:relative;
}

.password-wrapper button{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:auto;
    padding:8px 12px;
    background:#e5e7eb;
    color:#111827;
}

.dark .password-wrapper button{
    background:#374151;
    color:white;
}

</style>

</head>

<body>

<div class="login-page">

<div class="card login-card">

<div class="logo">

<img
src="assets/icons/icon-192.png"
alt="Logo">

<h1>Keuangan Pribadi</h1>

<p>Login Admin</p>

</div>

<label>PIN Admin</label>

<div class="password-wrapper">

<input
type="password"
id="pinLogin"
placeholder="Masukkan PIN Admin">

<button
type="button"
onclick="togglePIN()">
👁
</button>

</div>

<button
class="btn btn-primary btn-full"
onclick="login()">

🔐 Login

</button>

<br><br>

<button
class="btn btn-info btn-full"
onclick="toggleDarkMode()">

🌙 Dark Mode

</button>

<div
id="loginStatus"
class="status">

</div>

</div>

</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>

<script>

function togglePIN(){

const input =
document.getElementById(
"pinLogin"
);

if(input.type==="password"){

input.type="text";

}else{

input.type="password";

}

}

function login(){

const pin =
document.getElementById(
"pinLogin"
).value;

const status =
document.getElementById(
"loginStatus"
);

if(!pin){

status.style.color="red";
status.innerHTML=
"Masukkan PIN terlebih dahulu";

return;

}

if(verifyPIN(pin)){

loginAdmin();

status.style.color=
"green";

status.innerHTML=
"✅ Login berhasil";

setTimeout(()=>{

window.location.href =
"transaksi.html";

},1000);

}else{

status.style.color=
"red";

status.innerHTML=
"❌ PIN salah";

}

}

document
.getElementById("pinLogin")
.addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){
login();
}

}
);

if(isAdminLoggedIn()){

window.location.href =
"transaksi.html";

}

</script>

</body>
</html>
