<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Transaksi</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>➕ Tambah Transaksi</h1>
        <p>Kelola pemasukan dan pengeluaran</p>
    </div>

    <!-- Statistik -->

    <div class="card">

        <h3>📊 Statistik</h3>

        <p>
            Total Transaksi :
            <b id="jumlahTransaksi">0</b>
        </p>

    </div>

    <!-- Form -->

    <div class="card">

        <div class="info-box">

            Masukkan transaksi pemasukan atau pengeluaran.

        </div>

        <form id="formTransaksi">

            <label>Tanggal</label>

            <input
                type="date"
                id="tanggal"
                required>

            <label>Jenis Transaksi</label>

            <select id="jenis">

                <option value="Masuk">
                    📈 Pemasukan
                </option>

                <option value="Keluar">
                    📉 Pengeluaran
                </option>

            </select>

            <label>Kategori</label>

            <select id="kategori"></select>

            <label>Deskripsi</label>

            <textarea
                id="deskripsi"
                placeholder="Contoh: Gaji Bulanan"></textarea>

            <label>Nominal</label>

            <input
                type="number"
                id="nominal"
                min="1"
                required
                placeholder="Masukkan nominal">

            <button
                type="submit"
                class="btn btn-primary btn-full">

                💾 Simpan Transaksi

            </button>

            <!-- Mode Edit -->

            <div
                id="editActions"
                style="display:none;margin-top:10px;">

                <button
                    type="button"
                    class="btn btn-info btn-full"
                    onclick="updateTransaksi()">

                    ✏️ Update Transaksi

                </button>

                <br><br>

                <button
                    type="button"
                    class="btn btn-danger btn-full"
                    onclick="hapusTransaksiForm()">

                    🗑 Hapus Transaksi

                </button>

                <br><br>

                <button
                    type="button"
                    class="btn btn-warning btn-full"
                    onclick="batalEdit()">

                    ❌ Batal Edit

                </button>

            </div>

        </form>

        <div
            id="status"
            class="status"></div>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>🔍 Cari Transaksi</h3>

        <input
            type="text"
            id="searchTransaksi"
            placeholder="Cari kategori atau deskripsi...">

    </div>

    <!-- Daftar -->

    <div class="card">

        <h3>📋 Daftar Transaksi</h3>

        <p style="margin-bottom:10px;">
            Klik transaksi untuk mengedit.
        </p>

        <div id="daftarTransaksi">

            Belum ada transaksi

        </div>

    </div>

</div>

<!-- Bottom Navigation -->

<div class="bottom-nav">

    <a href="index.html">
        🏠
        <br>
        Dashboard
    </a>

    <a href="transaksi.html" class="active">
        ➕
        <br>
        Transaksi
    </a>

    <a href="laporan.html">
        📊
        <br>
        Laporan
    </a>

    <a href="profil.html">
        ⚙️
        <br>
        Profil
    </a>

</div>

<!-- Javascript -->

<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/transaksi.js"></script>

<!-- Service Worker -->

<script>

if ("serviceWorker" in navigatorster("./sw.js")
            .then(() => {
                console.log(
                    "✅ Service Worker Registered"
                );
            })
            .catch(error => {
                console.error(error);
            });

    });

}

</script>

</body>

</html>
